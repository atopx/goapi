app_name = "goapi"
app_version = "v0.2.0"

[server]
addr = "127.0.0.1:8080"
# 单位: 秒
read_timeout = 60
write_timeout = 60
# 单位: 字节
max_header_bytes = 1048576
# 优雅停机最长等待时间，单位: 秒
shutdown_timeout = 10

[logger]
# debug/info/warn/error
level = "debug"
filepath = "logs/runtime.log"
# 单位: 天
maxage = 1
# 单位: MB
maxsize = 100
# 最大保留日志文件数
backups = 7
# 是否在日志中记录调用位置 (source.file/line)
add_source = true

[database]
host = "127.0.0.1"
port = 5432
name = "goapi"
user = "postgres"
password = "postgres"
# disable / require / verify-ca / verify-full
ssl_mode = "disable"
max_idle_conn = 10
max_open_conn = 100
# 单位: 秒
max_idle_time = 3600
max_life_time = 3600

[redis]
host = "127.0.0.1"
port = 6379
password = ""
db = 0
pool_size = 10
# 单位: 秒
max_life_time = 3600

# 调度任务列表。name 必须与 internal/scheduler/<name>/ 的包名一致。
[[scheduler]]
name = "health"
spec = "@every 5s"
disable = false
